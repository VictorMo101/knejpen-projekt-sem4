name: Deploy to Simply.com

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TestCafe dependencies
        run: npm install

      - name: Run TestCafe test
        run: npx testcafe chrome:headless test/ --hostname localhost
        env:
          TEST_URL: https://yourdomain.simply.com

      - name: Deploy to Simply.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps           
          local-dir: ./wp-content/
          server-dir: /public_html/wp-content/
          exclude: |
            **/.git*
            **/node_modules/**
            **/.github/**
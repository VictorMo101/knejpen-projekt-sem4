name: Deploy to Simply.com

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # - name: Install TestCafe dependencies
      #   run: npm install

      # - name: Run TestCafe test
      #   run: npx testcafe chrome:headless test/ --hostname localhost
      #   env:
      #     TEST_URL: https://knejpen-projekt.dk

      - name: Deploy to Simply.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./wp-content/themes/knejpen/
          server-dir: /public_html/wp-content/themes/knejpen/
          exclude: |
            .git*
            .github/**
            node_modules/**


      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy Uploads via lftp
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }};
            mirror --reverse --verbose ./wp-content/uploads/ /public_html/wp-content/uploads/;
          "

            